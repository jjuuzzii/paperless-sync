name: Build & Release

# Schritt 1 (Grundgeruest): Trigger bei einem Versions-Tag (v1.2.0 usw.),
# zusaetzlich manuell ueber workflow_dispatch ausloesbar, um die komplette
# Kette (drei Build-Jobs + Release) zu testen, ohne einen echten Tag zu
# setzen - siehe check-version fuer den Unterschied im Ablauf.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

jobs:
  check-version:
    name: Versionscheck
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      is_prerelease: ${{ steps.resolve.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@v4

      - name: Version ermitteln (und bei einem Tag-Push gegen version.py pruefen)
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          # Zentrale Versionsnummer liegt in version.py im Repo-Root (NICHT
          # src/paperless_sync/__init__.py - das Package-__init__ hat keine
          # eigene __version__, siehe CLAUDE.md-Modulliste).
          FILE_VERSION=$(python3 -c "import re; print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', open('version.py').read()).group(1))")
          echo "In version.py gefundene Version: $FILE_VERSION"

          if [ "${{ github.event_name }}" = "push" ]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            TAG_VERSION="${TAG_NAME#v}"
            echo "Getaggte Version (aus Tag '$TAG_NAME'): $TAG_VERSION"
            if [ "$TAG_VERSION" != "$FILE_VERSION" ]; then
              echo "::error::Tag '$TAG_NAME' (Version $TAG_VERSION) stimmt nicht mit version.py ($FILE_VERSION) ueberein - Abbruch, um kein falsch beschriftetes Release zu veroeffentlichen. version.py vor dem Taggen anpassen (und den Tag ggf. neu setzen)."
              exit 1
            fi
            VERSION="$TAG_VERSION"
          else
            # workflow_dispatch: kein echter Tag vorhanden (siehe Schritt 7 -
            # manueller Testlauf), daher kein Vergleich moeglich/noetig -
            # die Version aus version.py wird direkt uebernommen.
            VERSION="$FILE_VERSION"
            echo "Manueller Testlauf (workflow_dispatch) - keine Tag-Pruefung, Version direkt aus version.py: $VERSION"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if echo "$VERSION" | grep -qE -- '-(beta|rc)'; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "Versionssuffix erkannt -> wird als Pre-release veroeffentlicht."
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  windows-build:
    name: Windows-Build
    needs: check-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhaengigkeiten installieren (App + PyInstaller)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Platzhalter-.env anlegen
        # Alle drei PyInstaller-Specs verlangen .env als Datendatei (siehe
        # config_manager.py), aber .env ist gitignored (enthaelt im echten
        # Betrieb Zugangsdaten) - ein frischer Checkout hat sie nicht.
        # .env.example enthaelt nur Platzhalterwerte, keine echten Secrets,
        # und reicht dem Build als Datenstruktur.
        run: Copy-Item .env.example .env

      - name: PyInstaller (Windows, onedir) ausfuehren
        run: pyinstaller build/desktop_app_qt.spec --clean --noconfirm --workpath .pyinstaller-work

      - name: Inno-Setup-Installer bauen
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: build/installer.iss

      - name: Installer-Artefakt benennen
        shell: pwsh
        run: |
          $version = "${{ needs.check-version.outputs.version }}"
          Rename-Item -Path "installer_output/PaperlessSync-Setup-$version.exe" -NewName "PaperlessSyncQt-Setup-$version.exe"

      - name: Portable ZIP packen (dist/PaperlessSyncQt/ komplett, inkl. _internal)
        shell: pwsh
        run: |
          $version = "${{ needs.check-version.outputs.version }}"
          Compress-Archive -Path "dist/PaperlessSyncQt" -DestinationPath "PaperlessSyncQt-$version-portable-windows.zip"

      - name: Installer als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: installer_output/PaperlessSyncQt-Setup-*.exe
          if-no-files-found: error

      - name: Portable ZIP als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: PaperlessSyncQt-*-portable-windows.zip
          if-no-files-found: error

  macos-build:
    name: macOS-Build
    needs: check-version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhaengigkeiten installieren (App + PyInstaller)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Platzhalter-.env anlegen
        # Siehe Windows-Job - .env ist gitignored, desktop_app_qt_macos.spec
        # verlangt sie trotzdem als Datendatei. .env.example hat nur
        # Platzhalterwerte.
        run: cp .env.example .env

      - name: PyInstaller (macOS, .app-Bundle) ausfuehren
        run: pyinstaller build/desktop_app_qt_macos.spec --clean --noconfirm --workpath .pyinstaller-work

      # Ohne Apple-Entwicklerkonto/Codesigning (siehe Kommentar in
      # desktop_app_qt_macos.spec) zeigt Gatekeeper beim ersten Start des
      # gebauten .app-Bundles eine Warnung ("nicht verifizierter
      # Entwickler") - bekannt und fuers Erste akzeptiert, aehnlich der
      # Windows-Smart-App-Control-Situation dieses Projekts. Notarisierung
      # waere ein spaeterer Schritt, sobald ein Apple-Entwicklerkonto
      # vorhanden ist.
      - name: .app-Bundle als ZIP packen
        # macOS-Apps werden ueblicherweise als ZIP verteilt, nicht direkt
        # als .app (u.a. weil ein einzelnes .app beim Download durch den
        # Browser/Quarantaene-Flag anders behandelt wird) - ditto statt
        # zip, da es Bundle-Struktur/Resource-Forks korrekt erhaelt (von
        # Apple fuer genau diesen Zweck empfohlen).
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          ditto -c -k --sequesterRsrc --keepParent "dist/PaperlessSyncQt.app" "PaperlessSyncQt-${VERSION}-macos.zip"

      - name: macOS-ZIP als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: PaperlessSyncQt-*-macos.zip
          if-no-files-found: error

  linux-build:
    name: Linux-Build
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhaengigkeiten installieren (App + PyInstaller)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Platzhalter-.env anlegen
        run: cp .env.example .env

      - name: PyInstaller (Linux, onefile) ausfuehren
        run: pyinstaller build/desktop_app_qt_linux.spec --clean --noconfirm --workpath .pyinstaller-work

      - name: Portable tar.gz packen (immer verfuegbar, siehe Anforderung 4)
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          tar -czf "PaperlessSyncQt-${VERSION}-portable-linux.tar.gz" -C dist PaperlessSyncQt

      - name: AppImage bauen
        # Best-effort: appimagetool ist ein externer Download, und
        # AppImages brauchen normalerweise FUSE, das auf GitHub-Runnern oft
        # fehlt (--appimage-extract-and-run umgeht das). continue-on-error
        # sorgt dafuer, dass ein Fehlschlag hier NICHT den ganzen Job
        # abbricht - das tar.gz oben bleibt in jedem Fall als Fallback
        # verfuegbar (Anforderung 4).
        id: appimage
        continue-on-error: true
        run: |
          set -e
          VERSION="${{ needs.check-version.outputs.version }}"

          mkdir -p AppDir/usr/bin
          cp dist/PaperlessSyncQt AppDir/usr/bin/PaperlessSyncQt
          chmod +x AppDir/usr/bin/PaperlessSyncQt
          ln -sf usr/bin/PaperlessSyncQt AppDir/AppRun
          chmod +x AppDir/AppRun

          cat > AppDir/paperlesssync.desktop << 'DESKTOP_EOF'
          [Desktop Entry]
          Name=Paperless Sync
          Exec=PaperlessSyncQt
          Icon=paperlesssync
          Type=Application
          Categories=Office;Finance;
          DESKTOP_EOF

          # Kein Linux-taugliches Icon (PNG/SVG) im Repo hinterlegt (nur
          # icon.ico fuer Windows, icon.icns fuer macOS) - Pillow ist ueber
          # reportlab (requirements.txt) bereits eine transitive
          # Abhaengigkeit, daher hier ohne zusaetzlichen Install nutzbar.
          python3 -c "from PIL import Image; Image.new('RGBA', (256, 256), (0, 90, 156, 255)).save('AppDir/paperlesssync.png')"

          wget -q -O appimagetool https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir "PaperlessSyncQt-${VERSION}-linux.AppImage"

      - name: AppImage als Artefakt hochladen (nur falls erfolgreich gebaut)
        if: steps.appimage.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: PaperlessSyncQt-*-linux.AppImage
          if-no-files-found: warn

      - name: Portables tar.gz als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: linux-portable
          path: PaperlessSyncQt-*-portable-linux.tar.gz
          if-no-files-found: error

  release:
    name: GitHub Release erstellen
    needs: [check-version, windows-build, macos-build, linux-build]
    runs-on: ubuntu-latest
    steps:
      - run: echo "TODO - wird in Schritt 5 ausgefuellt"
